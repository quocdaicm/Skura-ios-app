name: Build iOS IPA (unsigned)

# Nguon: sakura-part*.zip trong repo (uu tien) > zip trong Release tag "source" > clone ban goc.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Get source (sakura-part*.zip in repo > zip in Release "source" > upstream)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls sakura-part*.zip >/dev/null 2>&1; then
            echo "Using sakura-part*.zip from repo"
            mkdir -p app
            for z in sakura-part*.zip; do echo "unzip $z"; unzip -q -o "$z" -d app; done
          else
            mkdir -p dl
            if gh release download source --repo "${{ github.repository }}" --pattern '*.zip' --dir dl 2>/dev/null && ls dl/*.zip >/dev/null 2>&1; then
              echo "Using zip from Release"
              mkdir -p unz
              unzip -q dl/*.zip -d unz
              top="$(ls -d unz/*/ 2>/dev/null | head -1)"
              if [ -n "$top" ] && [ "$(ls unz | wc -l | tr -d ' ')" = "1" ]; then mv "$top" app; else mv unz app; fi
            else
              echo "No parts and no Release zip -> cloning upstream"
              git clone --depth 1 https://github.com/billpwchan/sakura-fantasy.git app
            fi
          fi
          test -f app/package.json || { echo "package.json not found in app/"; ls -la app; exit 1; }
          ls app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add mobile files (touch controls, iOS audio fix, Capacitor config)
        working-directory: app
        run: |
          mkdir -p src/ui
          cat > src/ui/touch.js <<'JSEOF'
          // Floating virtual joystick (FPS-style) on the left side of the screen.
          // Drag the thumb: left/right = steer the boat, up = speed up, down = slow down.
          // The rest of the screen still rotates the camera (swipe) and zooms (pinch).
          // It sends the same A/D/W/S key events the game already listens to. Hidden on mouse devices.
          if (window.matchMedia('(pointer: coarse)').matches) {
            const R = 60;          // joystick radius (px)
            const DEAD = 0.3;      // dead zone (0..1)

            const css = document.createElement('style');
            css.textContent = `
              #joyzone { position: fixed; left: 0; bottom: 0; width: 38vw; height: 72vh; z-index: 2;
                         touch-action: none; user-select: none; -webkit-user-select: none; }
              #joybase { position: fixed; z-index: 2; width: ${R * 2}px; height: ${R * 2}px; border-radius: 50%;
                         border: 2px solid rgba(255,243,234,.35); background: rgba(11,10,13,.28);
                         backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
                         opacity: .55; pointer-events: none; transition: opacity .2s; }
              #joybase.on { opacity: 1; }
              #joystick { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
                          border-radius: 50%; background: rgba(255,243,234,.55); border: 1px solid rgba(255,243,234,.9); }
              #joybase.on #joystick { background: rgba(200,64,42,.8); }
            `;
            document.head.appendChild(css);

            const zone = document.createElement('div'); zone.id = 'joyzone';
            const base = document.createElement('div'); base.id = 'joybase';
            const stick = document.createElement('div'); stick.id = 'joystick';
            base.appendChild(stick);
            document.body.append(zone, base);

            const home = () => ({
              x: Math.max(R + 28, 0) + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sal')) || 0) + 30,
              y: window.innerHeight - R - 34,
            });
            const place = (cx, cy) => { base.style.left = cx - R + 'px'; base.style.top = cy - R + 'px'; };
            const reset = () => { const h = home(); place(h.x, h.y); stick.style.transform = ''; };
            reset();
            window.addEventListener('resize', () => { if (!active) reset(); });

            const down = new Set();
            const key = (code, on) => {
              if (on === down.has(code)) return;
              on ? down.add(code) : down.delete(code);
              window.dispatchEvent(new KeyboardEvent(on ? 'keydown' : 'keyup', { code, bubbles: true }));
            };
            const release = () => ['KeyA', 'KeyD', 'KeyW', 'KeyS'].forEach((c) => key(c, false));

            let active = null, cx = 0, cy = 0;

            zone.addEventListener('pointerdown', (e) => {
              if (active !== null) return;
              active = e.pointerId;
              zone.setPointerCapture(e.pointerId);
              cx = Math.min(Math.max(e.clientX, R + 10), window.innerWidth * 0.38 - 10);
              cy = Math.min(e.clientY, window.innerHeight - R - 10);
              place(cx, cy);
              base.classList.add('on');
              move(e);
            });

            function move(e) {
              let dx = e.clientX - cx, dy = e.clientY - cy;
              const d = Math.hypot(dx, dy);
              if (d > R) { dx *= R / d; dy *= R / d; }
              stick.style.transform = `translate(${dx}px, ${dy}px)`;
              const nx = dx / R, ny = dy / R;
              key('KeyD', nx > DEAD);
              key('KeyA', nx < -DEAD);
              key('KeyS', ny > DEAD);
              key('KeyW', ny < -DEAD);
            }

            zone.addEventListener('pointermove', (e) => { if (e.pointerId === active) move(e); });
            const end = (e) => {
              if (e.pointerId !== active) return;
              active = null;
              base.classList.remove('on');
              release();
              reset();
            };
            zone.addEventListener('pointerup', end);
            zone.addEventListener('pointercancel', end);
            zone.addEventListener('contextmenu', (e) => e.preventDefault());
          }

          JSEOF
          cat > src/ui/ios-audio.js <<'JSEOF'
          // iOS: Web Audio is muted when the phone's silent switch is on, unless the page is also playing an
          // <audio> element. Looping an inaudible clip switches the audio session to "playback" so the music plays.
          (() => {
            const rate = 8000, n = rate; // 1 second of silence, 8-bit mono
            const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
            const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
            w(36, 'data'); v.setUint32(40, n, true);
            new Uint8Array(buf, 44).fill(128);
            const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
            a.loop = true; a.volume = 0.01; a.setAttribute('playsinline', '');
            const go = () => { a.play().catch(() => {}); };
            ['pointerdown', 'touchend', 'click', 'keydown'].forEach((t) =>
              window.addEventListener(t, go, { once: true, passive: true }));
            document.addEventListener('visibilitychange', () => { if (!document.hidden) go(); });
          })();

          JSEOF
          cat > capacitor.config.json <<'JSEOF'
          {
            "appId": "com.example.sakurafantasy",
            "appName": "Sakura Fantasy",
            "webDir": "dist",
            "ios": {
              "contentInset": "never",
              "backgroundColor": "#0b0a0d"
            }
          }

          JSEOF
          grep -q "ui/touch.js" src/main.js || { { echo "import './ui/touch.js';"; cat src/main.js; } > main.tmp && mv main.tmp src/main.js; }
          grep -q "ui/ios-audio.js" src/main.js || { { echo "import './ui/ios-audio.js';"; cat src/main.js; } > main.tmp && mv main.tmp src/main.js; }
          head -3 src/main.js

      - name: Patch for iPhone (lighter graphics, no intro, audio on touch, Vietnamese UI)
        working-directory: app
        run: |
          cat > mobile_patch.py <<'PYEOF'
          #!/usr/bin/env python3
          """Sakura Fantasy -> iPhone: lighter rendering, no intro screen, audio unlock, Vietnamese UI.
          Run from the project root. Every replacement must match or the build stops (so nothing is silently skipped)."""
          import sys

          fails = []
          def sub(path, old, new, count=1):
              s = open(path, encoding='utf-8').read()
              n = s.count(old)
              if n < 1 or (count and n != count):
                  fails.append(f'{path}: expected {count} match(es), found {n}: {old[:70]!r}')
                  return
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))

          # ---------------------------------------------------------------- main.js: no intro, audio on first touch
          M = 'src/main.js'
          sub(M, "const direct = params.size > 0 && !params.has('intro');", "const direct = !params.has('intro');")
          sub(M, "sun.shadow.mapSize.set(2048, 2048);", "sun.shadow.mapSize.set(512, 512);")
          sub(M, "  await warmShaders(pipe, scene, camera);\n",
                 "  ui.setStatus('Đang biên dịch hiệu ứng ánh sáng… lần đầu có thể mất 1–2 phút');\n  await new Promise((r) => setTimeout(r, 60));\n  try { await warmShaders(pipe, scene, camera); } catch (e) { console.error('[sf] shader warm-up failed: ' + (e && e.message || e)); }\n")
          sub(M, "  if (direct) {\n    ui.skip();\n  } else {", """  if (direct) {
              ui.skip();
              {
                const hint = document.createElement('div');
                hint.textContent = '🔊 Chạm màn hình để bật nhạc';
                hint.style.cssText = 'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:9;padding:7px 16px;border-radius:999px;background:rgba(11,10,13,.6);color:#fff3ea;font:14px serif;letter-spacing:.06em;pointer-events:none;transition:opacity .6s';
                document.body.appendChild(hint);
                const evs = ['touchend', 'click', 'pointerup'];
                const done = () => { evs.forEach((t) => window.removeEventListener(t, kick, true)); hint.style.opacity = '0'; setTimeout(() => hint.remove(), 700); };
                const kick = () => {
                  try {
                    if (!sound.ctx) sound.start(); else sound.setOn(true);
                    ctl.sound = true;
                    if (sound.ctx) {
                      if (sound.ctx.state === 'running') done();
                      else sound.ctx.addEventListener('statechange', () => { if (sound.ctx.state === 'running') done(); });
                    }
                  } catch (e) { console.warn('[sf] audio', e); }
                };
                evs.forEach((t) => window.addEventListener(t, kick, true));
              }
            } else {""")
          sub(M, "この端末では舟を出せません · WebGL2 is required", "Thiết bị này chưa chạy được · cần WebGL2")

          # ---------------------------------------------------------------- pipeline.js: lighter on phones
          P = 'src/core/pipeline.js'
          sub(P, "this.dpr = Math.min(window.devicePixelRatio || 1, 2);", "this.dpr = Math.min(window.devicePixelRatio || 1, 1.5);")
          sub(P, "this.scale = 1; // fraction of device pixels", "this.scale = 0.7; // fraction of device pixels")
          sub(P, "this.minScale = 0.5;", "this.minScale = 0.4;")
          sub(P, "this.reflScale = 0.5;", "this.reflScale = 0.3;")
          sub(P, "this.shadowEvery = 1;", "this.shadowEvery = 2;")
          sub(P, "this.rtOpaque.samples = this.dpr >= 1.5 ? 2 : 4;", "this.rtOpaque.samples = 0; // no MSAA on phones: saves a lot of GPU memory (context was being lost)")
          sub(P, "powerPreference: 'high-performance', ", "powerPreference: 'default', ")
          sub(P, "if (camY > 0.05) this.reflection.render(", "if (camY > 0.05 && (this.frame & 1) === 0) this.reflection.render(")

          # ---------------------------------------------------------------- grass: ~half the instances
          G = 'src/world/place-grass.js'
          sub(G, "for (let z = zFrom; z > zTo; z -= 0.95) {", "for (let z = zFrom; z > zTo; z -= 1.4) {")
          sub(G, "x < cx + span; x += 0.95) {", "x < cx + span; x += 1.4) {")
          sub(G, "const jx = x + R.range(-0.47, 0.47), jz = z + R.range(-0.47, 0.47);", "const jx = x + R.range(-0.7, 0.7), jz = z + R.range(-0.7, 0.7);")
          sub(G, "R.range(0.9, 1.45) * (sd < 3 ? 0.85 : 1)", "R.range(1.1, 1.75) * (sd < 3 ? 0.9 : 1)")

          # ---------------------------------------------------------------- Vietnamese: place + season names
          L = 'src/world/layout.js'
          for en, vi in [("Shallows of Morning Mist", "Bãi cạn sương sớm"), ("The Cherry Avenue", "Đại lộ hoa anh đào"),
                         ("The Vermilion Drum Bridge", "Cầu vòm đỏ son"), ("Village of the Five-Storey Pagoda", "Làng chùa năm tầng"),
                         ("The Bamboo Gorge", "Hẻm tre"), ("A Thousand Gates", "Ngàn cổng torii"), ("Lake of the Sacred Tree", "Hồ cây thần")]:
              sub(L, f"en: '{en}'", f"en: '{vi}'")
          H = 'src/journey/haiku.js'
          for en, vi in [("The Spring Scroll", "Cuộn tranh mùa xuân"), ("The Summer Scroll", "Cuộn tranh mùa hạ"),
                         ("The Autumn Scroll", "Cuộn tranh mùa thu"), ("The Winter Scroll", "Cuộn tranh mùa đông")]:
              sub(H, f"en: '{en}'", f"en: '{vi}'")

          # ---------------------------------------------------------------- Vietnamese: interface
          U = 'src/ui/ui.js'
          sub(U, "[['春', 'Spring'], ['夏', 'Summer'], ['秋', 'Autumn'], ['冬', 'Winter']]", "[['Xuân', 'Xuân'], ['Hạ', 'Hạ'], ['Thu', 'Thu'], ['Đông', 'Đông']]")
          sub(U, "['clear', '晴', 'Clear'], ['mist', '霧', 'Mist'], ['rain', '雨', 'Rain'], ['storm', '嵐', 'Storm'], ['snow', '雪', 'Snow']",
                 "['clear', 'Quang', 'Trời quang'], ['mist', 'Sương', 'Sương mù'], ['rain', 'Mưa', 'Mưa'], ['storm', 'Bão', 'Bão'], ['snow', 'Tuyết', 'Tuyết']")
          sub(U, "['follow', '随', 'Follow'], ['seat', '座', 'Passenger'], ['cinema', '映', 'Cinematic']",
                 "['follow', 'Theo', 'Theo thuyền'], ['seat', 'Ngồi', 'Ghế hành khách'], ['cinema', 'Phim', 'Điện ảnh']")
          sub(U, "'Hour of day'", "'Giờ trong ngày'")
          sub(U, "'自', 'Follow the journey'", "'Tự động', 'Theo hành trình'")
          sub(U, "'自', 'Weather of each place'", "'Tự động', 'Thời tiết từng nơi'")
          sub(U, "'止', 'Moor', () =>", "'Neo', 'Neo thuyền', () =>")
          sub(U, "'音', 'Sound'", "'Nhạc', 'Âm thanh'")
          sub(U, "'写', 'Photograph'", "'Chụp', 'Chụp ảnh'")
          sub(U, "'伝', 'Share this view'", "'Chia sẻ', 'Chia sẻ góc nhìn'")
          sub(U, "'記', 'About'", "'Info', 'Giới thiệu'")
          sub(U, "moored ? 'Set off' : 'Moor'", "moored ? 'Nhổ neo' : 'Neo thuyền'")
          sub(U, "Drag to frame · Wheel to zoom", "Vuốt để lấy khung · Chụm để zoom")
          sub(U, "戻<i>Back</i>", "Quay lại<i></i>")
          sub(U, 'aria-label="Take photograph"', 'aria-label="Chụp"')
          sub(U, "止<i>Hold</i>", "Neo<i></i>")
          sub(U, "<span><kbd>W S</kbd>速さ</span><span><kbd>A D</kbd>舵</span><span><kbd>Drag</kbd>見回す</span><span><kbd>Wheel</kbd>寄る</span><span><kbd>C</kbd>視点</span><span><kbd>Space</kbd>止まる</span>",
                 "<span><kbd>Cần trái</kbd>lái thuyền</span><span><kbd>Vuốt</kbd>xoay camera</span><span><kbd>Chụm</kbd>phóng to</span>")
          sub(U, '<div class="keys"><b>W / S</b><span>faster, slower</span><b>A / D</b><span>steer</span><b>Drag · Wheel</b><span>look around, come closer</span><b>C</b><span>follow, passenger, cinematic</span><b>Space</b><span>moor or set off</span><b>M</b><span>sound on or off</span><b>P · H</b><span>photograph, hide the interface</span></div>',
                 '<div class="keys"><b>Cần trái</b><span>kéo lên/xuống: nhanh/chậm · trái/phải: lái</span><b>Vuốt</b><span>xoay camera</span><b>Chụm</b><span>phóng to, thu nhỏ</span><b>視</b><span>đổi góc nhìn: theo thuyền, hành khách, điện ảnh</span><b>止</b><span>neo thuyền / nhổ neo</span><b>音</b><span>bật / tắt âm thanh</span><b>写</b><span>chụp ảnh</span></div>')
          sub(U, "A boat journey down one river, through four seasons and a thousand lights — from the morning mist, under the cherry avenue and the vermilion bridge, past the village of the five-storey pagoda and through the bamboo gorge, beneath a thousand gates to the lake of the sacred tree. Each voyage turns the season.",
                 "Một chuyến đi thuyền trên dòng sông, qua bốn mùa và ngàn ánh đèn — từ sương sớm, dưới đại lộ hoa anh đào và cây cầu đỏ son, qua làng chùa năm tầng và hẻm tre, dưới ngàn cổng torii tới hồ cây thần. Mỗi chuyến đi lại sang một mùa mới.")
          sub(U, "Inspired by Meng To’s ", "Lấy cảm hứng từ ")
          sub(U, ". Built from scratch with three.js; the ", ". Viết từ đầu bằng three.js; ")
          sub(U, ">source is on GitHub</a>", ">mã nguồn trên GitHub</a>")
          sub(U, "Haiku by Bashō, Buson, Issa, Shiki, Bonchō, Ryōkan and Chiyo-ni; English versions written for this piece.", "Haiku của Bashō, Buson, Issa, Shiki, Bonchō, Ryōkan và Chiyo-ni; bản tiếng Anh viết riêng cho tác phẩm này.")
          sub(U, "'This place, this season, this hour — the link is copied'", "'Đã sao chép liên kết: đúng nơi, đúng mùa, đúng giờ'")
          sub(U, "<i>Set sail</i>", "<i>Nhổ neo</i>")
          sub(U, "Open source on GitHub", "Mã nguồn mở trên GitHub")
          sub(U, 'aria-label="Close"', 'aria-label="Đóng"')
          # loading status text (Vietnamese) under the ink circle
          sub(U, "  // loading can finish in a blink; the brush still takes its time\n  progress(p) {\n",
                 """  setStatus(t) {
              if (!this.statusEl) {
                this.statusEl = document.createElement('div');
                this.statusEl.style.cssText = 'position:absolute;left:0;right:0;bottom:7vh;text-align:center;font:15px serif;letter-spacing:.1em;color:#fff3ea;opacity:.85;padding:0 20px;z-index:3';
                this.loader.appendChild(this.statusEl);
              }
              this.statusEl.textContent = t;
            }

            // loading can finish in a blink; the brush still takes its time
            progress(p) {
              this.setStatus(p < 1 ? 'Đang tạo thế giới… ' + Math.round(p * 100) + '%' : 'Đang chuẩn bị…');
          """)

          # ---------------------------------------------------------------- Vietnamese: dock labels instead of kanji
          for k, v in [("grp('季')", "grp('Mùa')"), ("grp('時')", "grp('Giờ')"), ("grp('天')", "grp('Trời')"), ("grp('視')", "grp('Góc nhìn')")]:
              sub(U, k, v)
          sub(U, "this.sailBtn.firstChild.textContent = moored ? '行' : '止';", "this.sailBtn.firstChild.textContent = moored ? 'Đi' : 'Neo';")
          sub(U, "this.holdBtn.firstChild.textContent = moored ? '行' : '止';", "this.holdBtn.firstChild.textContent = moored ? 'Đi' : 'Neo';")
          sub(U, "`${BRANCH[Math.floor(((h + 1) % 24) / 2)]}の刻`", "'Giờ ' + ['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'][Math.floor(((h + 1) % 24) / 2)]")
          sub(U, "<b>舟を出す</b>", "<b>Khởi hành</b>")
          sub(U, '<span class="seal">出舟</span>', '<span class="seal">Đi</span>')
          sub(U, "一舟　四季　千灯</div>';", "Một thuyền · Bốn mùa · Ngàn đèn</div>';")
          open('src/ui/ui.css', 'a', encoding='utf-8').write("""
          .dock .b { font-size: 14px; letter-spacing: 0.02em; min-width: 0; padding: 0 9px; white-space: nowrap; }
          .dock .b.auto { font-size: 12px; }
          .dock .cat { letter-spacing: 0.08em; margin-right: 0; font-size: 12px; }
          @media (max-width: 1040px), (max-height: 560px) {
            .dock .grp .cat { font-size: 15px; letter-spacing: 0; padding: 8px 8px; }
            .dock .b { font-size: 15px; padding: 0 8px; }
            .photo .side { font-size: 15px; }
          }
          """)

          if fails:
              print('PATCH FAILED:\n' + '\n'.join(fails)); sys.exit(1)
          print('all patches applied')

          PYEOF
          python3 mobile_patch.py
          rm -f mobile_patch.py
          cat > src/ui/errlog.js <<'JSEOF2'
          // Shows errors on screen (in Vietnamese) so they can be screenshotted: there is no console on a phone.
          (() => {
            const box = document.createElement('pre');
            box.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:40vh;overflow:auto;z-index:99999;margin:0;padding:8px 10px;border-radius:8px;background:rgba(120,10,10,.88);color:#fff;font:11px/1.35 monospace;white-space:pre-wrap;display:none';
            box.addEventListener('click', () => { box.style.display = 'none'; box.textContent = ''; });
            const attach = () => document.body && document.body.appendChild(box);
            if (document.body) attach(); else document.addEventListener('DOMContentLoaded', attach);
            let n = 0;
            const show = (msg) => {
              if (n++ > 6) return;
              box.style.display = 'block';
              box.textContent += (box.textContent ? '\n---\n' : 'Lỗi (chạm để ẩn, chụp màn hình gửi lại):\n') + String(msg).slice(0, 500);
            };
            document.addEventListener('webglcontextlost', (e) => { e.preventDefault(); show('WebGL context LOST (het bo nho GPU / iOS tu ngat)'); }, true);
            window.addEventListener('error', (e) => show((e.message || 'error') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '')));
            window.addEventListener('unhandledrejection', (e) => show('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
            const ce = console.error.bind(console);
            console.error = (...a) => { ce(...a); show(a.map((x) => (x && x.message) || String(x)).join(' ')); };
          })();

          JSEOF2
          grep -q "ui/errlog.js" src/main.js || { { echo "import './ui/errlog.js';"; cat src/main.js; } > main.tmp && mv main.tmp src/main.js; }
          head -4 src/main.js

      - name: Vietnamese pass 2 (haiku, place names, season cards, brand)
        working-directory: app
        run: |
          cat > vi_patch2.py <<'PYEOF'
          #!/usr/bin/env python3
          """Vietnamese pass 2: haiku, place names, season cards, brand text; hides the Japanese column (vertical text)."""
          import re, sys

          fails = []
          def sub(path, old, new, count=1):
              s = open(path, encoding='utf-8').read()
              n = s.count(old)
              if n < 1 or (count and n != count):
                  fails.append(f'{path}: expected {count} match(es), found {n}: {old[:70]!r}')
                  return
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))

          # first line of the Japanese verse -> Vietnamese version (3 lines)
          VI = {
           '春なれや': ['Xuân đến rồi chăng —', 'trên ngọn đồi không tên', 'một màn sương mỏng'],
           '朝顔に': ['Hoa bìm bìm quấn', 'lấy gàu múc nước của tôi —', 'đành xin nước người'],
           '霧しぐれ': ['Mưa phùn sương mờ —', 'ngày núi Phú Sĩ khuất bóng', 'cũng có cái thú riêng'],
           'ながながと': ['Dài, dài làm sao —', 'một đường sông duy nhất', 'giữa cánh đồng tuyết'],
           'さまざまの': ['Bao nhiêu chuyện cũ', 'chợt hiện về trong tâm trí —', 'hoa anh đào'],
           '夏草や': ['Cỏ mùa hạ —', 'tất cả những gì còn lại', 'của giấc mộng chiến binh'],
           '山は暮れて': ['Núi đã tối rồi;', 'ngoài đồng còn vương hoàng hôn', 'trên đám cỏ bạc'],
           'いくたびも': ['Hết lần này đến lần khác', 'tôi hỏi tuyết', 'đã dày thêm bao nhiêu'],
           '散る桜': ['Hoa đang rơi —', 'những cánh còn trên cành', 'rồi cũng sẽ rơi'],
           '五月雨を': ['Gom hết những cơn mưa', 'đầu hạ, dòng sông chảy', 'nhanh làm sao'],
           'この道や': ['Con đường này', 'chẳng còn ai đi nữa —', 'chiều thu'],
           'いざさらば': ['Nào, ta đi thôi', 'ngắm tuyết, cho đến lúc', 'ngã lăn ra đất'],
           '花の雲': ['Mây hoa anh đào —', 'tiếng chuông kia từ Ueno', 'hay từ Asakusa?'],
           'さみだれや': ['Mưa đầu hạ —', 'trước dòng sông nước dâng', 'hai ngôi nhà'],
           '柿くへば': ['Tôi cắn trái hồng —', 'và chuông ngân vang', 'ở chùa Hōryū'],
           'これがまあ': ['Vậy đây rồi,', 'là nơi trú cuối cùng của tôi —', 'tuyết dày năm thước'],
           '山路来て': ['Đi trên đường núi,', 'bỗng thấy dịu dàng —', 'một đóa violet dại'],
           '閑さや': ['Tĩnh lặng làm sao —', 'tiếng ve sầu', 'thấm vào đá'],
           '枯朶に': ['Trên cành khô', 'một con quạ đậu —', 'chiều thu'],
           '初しぐれ': ['Cơn mưa đông đầu tiên —', 'đến chú khỉ cũng như muốn', 'một chiếc áo tơi nhỏ'],
           '菜の花や': ['Hoa cải vàng —', 'trăng ở phía đông,', 'mặt trời ở phía tây'],
           '大蛍': ['Một con đom đóm lớn', 'chầm chậm, chầm chậm', 'bay ngang qua'],
           '物いへば': ['Khi tôi lên tiếng', 'môi bỗng lạnh đi —', 'gió thu'],
           '冬の日や': ['Nắng đông —', 'đóng băng trên lưng ngựa,', 'cái bóng của chính tôi'],
           '古池や': ['Ao xưa —', 'con ếch nhảy vào,', 'tiếng nước vang'],
           'おもしろうて': ['Thật vui, rồi lại', 'thật buồn —', 'những chiếc thuyền cò biển'],
           '名月や': ['Trăng rằm —', 'tôi đi quanh bờ ao', 'suốt đêm dài'],
           '旅に病んで': ['Ốm giữa chuyến đi —', 'giấc mơ vẫn lang thang', 'trên cánh đồng khô'],
          }

          H = 'src/journey/haiku.js'
          s = open(H, encoding='utf-8').read()
          s = re.sub(r"jp: \['([^']+)', '[^']+', '[^']+'\], en: (\[[^\]]*\])", lambda m: m.group(0).replace(m.group(2), '[' + ', '.join('"' + x + '"' if "'" in x else "'" + x + "'" for x in VI[m.group(1)]) + ']') if m.group(1) in VI else (fails.append('missing ' + m.group(1)) or m.group(0)), s)
          for k in VI:
              if k not in s: fails.append('verse not found: ' + k)
          open(H, 'w', encoding='utf-8').write(s)
          for jp, kana, vi in [('春', 'はる', 'Xuân'), ('夏', 'なつ', 'Hạ'), ('秋', 'あき', 'Thu'), ('冬', 'ふゆ', 'Đông')]:
              sub(H, f"{{ jp: '{jp}', kana: '{kana}',", f"{{ jp: '{vi}', kana: '',")

          # place names
          L = 'src/world/layout.js'
          for jp, kana, vi in [('朝霧の瀬', 'あさぎりのせ', 'Bãi cạn sương sớm'), ('桜並木', 'さくらなみき', 'Đại lộ hoa anh đào'),
                  ('朱の太鼓橋', 'あけのたいこばし', 'Cầu vòm đỏ son'), ('五重塔の里', 'ごじゅうのとうのさと', 'Làng chùa năm tầng'),
                  ('竹林峡', 'ちくりんきょう', 'Hẻm tre'), ('千本鳥居', 'せんぼんとりい', 'Ngàn cổng torii'), ('御神木の湖', 'ごしんぼくのみずうみ', 'Hồ cây thần')]:
              sub(L, f"jp: '{jp}', kana: '{kana}'", f"jp: '{vi}', kana: ''")

          U = 'src/ui/ui.js'
          sub(U, "<b>${p.jp}</b><i>${p.en}</i>", "<b>${p.en}</b>")
          sub(U, "`${p.jp} — ${p.en}`", "`${p.en}`")
          sub(U, "{ asagiri: '朝', sakura: '桜', bridge: '橋', village: '塔', gorge: '竹', torii: '鳥', lake: '湖' }",
                 "{ asagiri: '1', sakura: '2', bridge: '3', village: '4', gorge: '5', torii: '6', lake: '7' }")
          sub(U, '<div class="brand">桜幻想<small>Sakura Fantasy</small></div>', '<div class="brand">Sakura<small>Fantasy</small></div>')
          sub(U, '<h2>桜幻想<small>Sakura Fantasy</small></h2>', '<h2>Sakura Fantasy<small>Hoa anh đào huyền ảo</small></h2>')
          sub(U, "'<span>桜</span><span>幻</span><span>想</span>'", "'<span>Sakura</span><span>Fantasy</span>'")
          sub(U, "chars('桜幻想', 0.2, 0.32)", "chars('Sakura', 0.2, 0.32)")
          sub(U, "chars('一舟　四季　千灯', 1.3, 0.07)", "chars('Một thuyền · Bốn mùa · Ngàn đèn', 1.3, 0.07)")
          sub(U, "g.fillText('桜', 0, 1 * k);", "g.fillText('S', 0, 1 * k);")
          sub(U, '<div class="seal">桜幻</div>', '<div class="seal">SF</div>')
          sub(U, "'この地　この季　この刻'", "'Đã sao chép liên kết'")
          sub(U, "'写してお持ちください'", "'Hãy chụp màn hình để lưu'")
          sub(U, "The river is open source — GitHub", "Dòng sông là mã nguồn mở — GitHub")
          sub(U, "Textures and scanned rocks, ferns and logs from", "Texture, đá, dương xỉ và khúc gỗ quét 3D từ")
          sub(U, "plant scans (CC0). ", "(CC0). ")
          sub(U, "Trees, flowers and grasses rendered from", "Cây, hoa và cỏ dựng từ bản quét thực vật của")
          sub(U, " by <a href=\"https://sketchfab.com/Z-gon\"", " của <a href=\"https://sketchfab.com/Z-gon\"")
          sub(U, "All sources</a>", "Toàn bộ nguồn</a>")

          for k, v in [('<b>視</b>', '<b>Góc</b>'), ('<b>止</b>', '<b>Neo</b>'), ('<b>音</b>', '<b>Nhạc</b>'), ('<b>写</b>', '<b>Chụp</b>'), ('">撮</button>', '">●</button>')]:
              sub(U, k, v)

          # the vertical Japanese column (name, kana, number, haiku) is replaced by the Vietnamese lines below it
          open('src/ui/ui.css', 'a', encoding='utf-8').write("""
          .chapter .col .name, .chapter .col .kana, .chapter .col .num, .chapter .col .haiku { display: none; }
          .chapter .en .place { text-transform: none; letter-spacing: 0.12em; font-size: clamp(15px, 2vh, 19px); }
          .chapter .en .by { text-transform: none; letter-spacing: 0.1em; }
          .paper .glyph { font-size: min(26vmin, 220px); letter-spacing: 0.02em; }
          .paper .cap .e { text-transform: none; }
          #load .title { writing-mode: horizontal-tb; flex-direction: column; align-items: center; letter-spacing: 0.08em; font-size: clamp(30px, 11vh, 64px); gap: 0.1em; }
          .scroll .brand { writing-mode: horizontal-tb; font-size: 15px; letter-spacing: 0.12em; }
          """)

          if fails:
              print('PATCH2 FAILED:\n' + '\n'.join(fails)); sys.exit(1)
          print('vi pass 2 applied')
          PYEOF
          python3 vi_patch2.py
          rm -f vi_patch2.py

      - name: Install deps + Capacitor
        working-directory: app
        run: |
          npm ci
          npm i --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Drop desktop-only hi-res models (phones use the quick tier)
        working-directory: app
        run: rm -rf public/assets/models/hi

      - name: Shrink textures for phones (stops the WebGL context from being lost)
        working-directory: app
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          cat > shrink_tex.py <<'PYEOF'
          # Phones lose the WebGL context when ~600 MB of decoded textures are uploaded. Halve the colour maps and
          # quarter the normal maps: UVs are normalised, so nothing else in the game has to change.
          import sys, glob, os
          from PIL import Image
          before = after = 0
          for p in sorted(glob.glob(os.path.join(sys.argv[1], '*.webp'))):
              im = Image.open(p); w, h = im.size
              target = 512 if p.endswith('_n.webp') else 1024
              k = min(1.0, target / max(w, h))
              before += w * h
              if k < 1:
                  nw, nh = max(1, round(w * k)), max(1, round(h * k))
                  if im.mode not in ('RGB', 'RGBA'): im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  im.resize((nw, nh), Image.LANCZOS).save(p, 'WEBP', quality=88, method=4)
                  after += nw * nh
              else:
                  after += w * h
          print('textures: %.0f MB -> %.0f MB (decoded, with mips)' % (before * 5.3 / 1e6, after * 5.3 / 1e6))
          PYEOF
          python3 shrink_tex.py public/assets/tex
          rm -f shrink_tex.py
          python3 - <<'PYEOF2'
          p = 'src/world/grass.js'
          s = open(p, encoding='utf-8').read()
          old = 'dFdx(vCardUv * 2048.0), dv = dFdy(vCardUv * 2048.0)'
          assert s.count(old) == 1, 'grass lod constant not found'
          open(p, 'w', encoding='utf-8').write(s.replace(old, 'dFdx(vCardUv * 1024.0), dv = dFdy(vCardUv * 1024.0)'))
          print('grass lod constant updated')
          PYEOF2

      - name: Build web
        working-directory: app
        run: npm run build

      - name: Create iOS project
        working-directory: app
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Configure Info.plist (landscape, fullscreen)
        working-directory: app
        run: |
          P=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :UISupportedInterfaceOrientations" $P || true
          $PB -c "Add :UISupportedInterfaceOrientations array" $P
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" $P
          $PB -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" $P
          $PB -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          $PB -c "Add :UISupportedInterfaceOrientations~ipad array" $P
          $PB -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" $P
          $PB -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" $P
          $PB -c "Add :UIStatusBarHidden bool true" $P || $PB -c "Set :UIStatusBarHidden true" $P
          $PB -c "Set :UIViewControllerBasedStatusBarAppearance false" $P || $PB -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $P
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true

      - name: Archive (no code signing)
        working-directory: app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr SakuraFantasy.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SakuraFantasy-ipa
          path: app/SakuraFantasy.ipa
